Los servicios detallados son los únicos incluidos. Cualquier entregable adicional será presupuestado por separado.

2. REVISIONES

3. FORMA DE PAGO
Pago al inicio del trabajo. Métodos: Vita Wallet · PayPal · Prex · Transferencia · Efectivo.

4. ENTREGA DE MATERIAL
El material del cliente debe entregarse antes de iniciar. Demoras pueden afectar plazos.

5. CALIDAD Y ESTILO

const LS_KEY = 'nw_budget_v7';
const fmt = (n) => `CLP$${Number(n).toLocaleString('es-CL')}`;
const fmtFx = (clp, key) => { const r=RATES[key]; const v=clp*r.rate; return v.toLocaleString('es-CL',{maximumFractionDigits:v<10?2:0}); };
const loadState = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)||'null'); } catch { return null; } };
const saveState = (s) => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} };
const generarWhatsApp = (state) => {
  const sub=state.items.reduce((s,i)=>s+i.precio*(i.qty||1),0);
  const d=state.descuento.valor>0?sub*(state.descuento.valor/100):0;
  const tot=sub-d;
  const items=state.items.map(i=>`• ${i.nombre}: ${fmt(i.precio*(i.qty||1))}`).join('\n');
  const msg=`Hola NAWEMEDIA 👋\n\nAcabo de generar mi presupuesto:\n\nCliente: ${state.cliente.nombre}\n\nServicios:\n${items}\n\nTOTAL: ${fmt(tot)}\n\n¿Podemos hablar?`;
  return `https://wa.me/56959985061?text=${encodeURIComponent(msg)}`;
};

  whatsapp:<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.013.496 3.916 1.372 5.594L0 24l6.584-1.342A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.01-1.372l-.36-.213-3.906.796.816-3.784-.235-.378A9.818 9.818 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182c5.43 0 9.818 4.388 9.818 9.818 0 5.43-4.388 9.818-9.818 9.818z"/></svg>,

  pay:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,

const Ico = ({name,size=20,color='currentColor',style={}}) => (
  <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,color,flexShrink:0,...style}}>
    {ICONS[name]||ICONS.close}

const SvcIcon = ({icon,gradient,size=44}) => (
  <div style={{width:size,height:size,borderRadius:12,flexShrink:0,background:gradient||T.gradMain,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 14px rgba(255,45,149,0.22)',color:'#fff'}}>
    <Ico name={icon} size={size*0.47}/>
  </div>
);

// ─── WAVEFORM ─────────────────────────────────────────────────────────────────
const Waveform = ({width=96,height=10}) => {
  const bars = Array.from({length:20},(_,i)=>4+Math.abs(Math.sin(i*0.85+1.2))*(height-5));
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{opacity:0.65}}>
      <defs><linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor="#FF2D95"/><stop offset="50%" stopColor="#7B61FF"/><stop offset="100%" stopColor="#00E5FF"/></linearGradient></defs>
      {bars.map((h,i)=><rect key={i} x={i*(width/20)} y={(height-h)/2} width={Math.max(2,width/20-1)} height={h} rx="1.5" fill="url(#wg)"/>)}
    </svg>
  );
};

const StepperProgress = ({step}) => {
  const steps=['Servicios','Cotización','Listo'];
  return (
    <div style={{maxWidth:480,margin:'0 auto',padding:'14px 24px 8px',display:'flex',alignItems:'center'}}>
      {steps.map((s,i)=>(
        <React.Fragment key={s}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:i<=step?T.gradMain:T.bgCard,border:i<=step?'none':`1px solid ${T.borderMd}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:i<=step?'#fff':T.textFnt,boxShadow:i===step?'0 0 12px rgba(255,45,149,0.5)':'none',transition:'all 0.3s',flexShrink:0}}>
              {i<step?<Ico name="check" size={13}/>:i+1}
            </div>
            <div style={{fontSize:10,fontWeight:i===step?700:500,color:i===step?T.text:T.textFnt,letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{s}</div>
          </div>
          {i<steps.length-1&&<div style={{flex:1,height:1,background:i<step?T.gradMain:T.border,margin:'0 6px',marginBottom:18,transition:'background 0.3s'}}/>}
        </React.Fragment>
      ))}
    </div>
  );
};

const GradBtn = ({children,onClick,disabled,style={},variant='primary',size='md'}) => {
  const [hov,setHov]=React.useState(false);
  const sz={sm:{padding:'8px 14px',fontSize:12,borderRadius:10},md:{padding:'13px 20px',fontSize:14,borderRadius:14},lg:{padding:'15px 24px',fontSize:15,borderRadius:16}}[size]||{padding:'13px 20px',fontSize:14,borderRadius:14};
  const base={...sz,fontWeight:700,fontFamily:'inherit',cursor:disabled?'not-allowed':'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:7,transition:'all 0.2s',border:'none',...style};
  if(variant==='secondary') return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,background:hov?T.bgCardHov:'transparent',border:`1px solid ${T.borderHi}`,color:T.text,opacity:disabled?0.4:1}}>{children}</button>;
  if(variant==='success') return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,background:hov?'rgba(34,197,94,0.2)':'rgba(34,197,94,0.08)',border:`1px solid rgba(34,197,94,0.4)`,color:T.green,opacity:disabled?0.4:1}}>{children}</button>;
  if(variant==='add') return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,background:T.gradBtn,color:'#fff',opacity:disabled?0.45:1,boxShadow:hov?'0 0 18px rgba(255,45,149,0.45)':'0 0 8px rgba(255,45,149,0.18)'}}>{children}</button>;
  return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,width:'100%',background:disabled?T.bgCard:T.gradBtn,color:disabled?T.textFnt:'#fff',boxShadow:!disabled&&hov?'0 0 24px rgba(255,45,149,0.5)':!disabled?'0 0 10px rgba(255,45,149,0.22)':'none'}}>{children}</button>;

// ─── SCREEN: FIRMA ────────────────────────────────────────────────────────────
const FirmaScreen = ({state,onConfirm,onBack}) => {
  const canvasRef=React.useRef(null);
  const [drawing,setDrawing]=React.useState(false);
  const [hasSig,setHasSig]=React.useState(false);
  const [showConds,setShowConds]=React.useState(false);
  const [sigName,setSigName]=React.useState(state.cliente.nombre||'');
  const subtotal=state.items.reduce((s,i)=>s+i.precio*(i.qty||1),0);
  const discAmt=state.descuento.valor>0?subtotal*(state.descuento.valor/100):0;
  const total=subtotal-discAmt;

  React.useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    ctx.strokeStyle='#FFC300';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    const getPos=(e)=>{const r=canvas.getBoundingClientRect();const scX=canvas.width/r.width;const scY=canvas.height/r.height;const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*scX,y:(src.clientY-r.top)*scY};};
    const start=(e)=>{e.preventDefault();setDrawing(true);const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
    const move=(e)=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();setHasSig(true);};
    const end=(e)=>{e.preventDefault();setDrawing(false);};
    canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end,{passive:false});
    return()=>{canvas.removeEventListener('mousedown',start);canvas.removeEventListener('mousemove',move);canvas.removeEventListener('mouseup',end);canvas.removeEventListener('touchstart',start);canvas.removeEventListener('touchmove',move);canvas.removeEventListener('touchend',end);};
  },[drawing]);

  const clearSig=()=>{const canvas=canvasRef.current;if(canvas)canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);setHasSig(false);};
  const handleConfirm=()=>{
    if(!sigName.trim()){alert('Por favor ingresá tu nombre completo.');return;}
    if(!hasSig){alert('Por favor firmá en el recuadro.');return;}
    const sig=canvasRef.current?.toDataURL('image/png')||'';
    const timestamp=new Date().toLocaleString('es-AR',{dateStyle:'long',timeStyle:'short'});
    onConfirm({sig,name:sigName,timestamp});
  };

  return (
    <div className="fade-in" style={{maxWidth:480,margin:'0 auto',padding:'16px 16px 50px'}}>
      <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:T.textMut,display:'flex',alignItems:'center',gap:6,fontSize:13,marginBottom:20,padding:0}}><Ico name="back" size={16}/> Volver</button>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:800,color:T.text,margin:'0 0 6px'}}>Confirmá tu presupuesto</h2>
        <p style={{fontSize:13,color:T.textMut,margin:0}}>Revisá los detalles y confirmá para avanzar.</p>
      </div>
      <Card style={{marginBottom:12}}>
        <SectionLabel>Servicios seleccionados</SectionLabel>
        {state.items.map(item=>(
          <div key={item.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:`1px solid ${T.border}`,fontSize:13}}>
            <span style={{color:T.textMd}}>{item.nombre}{(item.qty||1)>1?` ×${item.qty}`:''}</span>
            <span style={{fontWeight:700,color:T.yellow}}>{fmt(item.precio*(item.qty||1))}</span>
          </div>
        ))}
        <div style={{marginTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:T.textMut,marginBottom:6}}><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
          {discAmt>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:T.green,marginBottom:6}}><span>{state.descuento.label}</span><span>− {fmt(discAmt)}</span></div>}
          <div style={{display:'flex',justifyContent:'space-between',fontSize:20,fontWeight:900,borderTop:`1px solid ${T.borderMd}`,paddingTop:10,marginTop:4}}><span style={{color:T.textMd}}>TOTAL</span><span style={{color:T.yellow}}>{fmt(total)}</span></div>
        </div>
      </Card>
      <Card style={{marginBottom:12}}>
        <SectionLabel>Condiciones principales</SectionLabel>
        {['Entrega en los plazos acordados.','Incluye revisiones según el plan.','Pago 50% para iniciar el proyecto.','Material final en formatos acordados.'].map((c,i)=>(
          <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:8}}><Ico name="check" size={14} color={T.green} style={{marginTop:1,flexShrink:0}}/><span style={{fontSize:13,color:T.textMd}}>{c}</span></div>
        ))}
        <button onClick={()=>setShowConds(!showConds)} style={{background:'none',border:'none',cursor:'pointer',color:T.cyan,fontSize:12,fontWeight:700,padding:0,marginTop:4,fontFamily:'inherit'}}>
          {showConds?'▲ Ocultar condiciones completas':'▼ Ver condiciones completas'}
        </button>
        {showConds&&<pre style={{fontSize:11,color:T.textFnt,lineHeight:1.7,whiteSpace:'pre-wrap',fontFamily:'inherit',margin:'12px 0 0',padding:12,background:T.bgInset,borderRadius:T.radiusSm}}>{CONDITIONS}</pre>}
      </Card>
      <Card style={{marginBottom:12}}><InputField label="Nombre completo para la firma" value={sigName} onChange={setSigName} placeholder="Tu nombre y apellido"/></Card>
      <Card style={{marginBottom:12}}>
        <SectionLabel>Firma digital (dibujá con el dedo)</SectionLabel>
        <div style={{border:`1px solid ${hasSig?'rgba(255,195,0,0.4)':T.borderMd}`,borderRadius:T.radiusSm,overflow:'hidden',background:'rgba(0,0,0,0.5)',position:'relative'}}>
          <canvas ref={canvasRef} width={680} height={160} style={{width:'100%',height:140,display:'block',cursor:'crosshair'}}/>
          {!hasSig&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><span style={{fontSize:13,color:T.textFnt,opacity:0.6}}>Firmá aquí →</span></div>}
        </div>
        <button onClick={clearSig} style={{background:'none',border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 12px',color:T.textMut,cursor:'pointer',fontSize:11,fontFamily:'inherit',marginTop:8}}>Limpiar firma</button>
      </Card>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
        {[{icon:'whatsapp',color:'#25D366',bg:'rgba(37,211,102,0.08)',border:'rgba(37,211,102,0.25)',label:'WhatsApp',onClick:()=>window.open(generarWhatsApp(state),'_blank')},
          {icon:'pay',color:T.violet,bg:'rgba(123,97,255,0.08)',border:'rgba(123,97,255,0.25)',label:'Pagar 50%',onClick:()=>{alert(`Adelanto: ${fmt(Math.round(total*0.5))}\n\nTe enviamos los datos por WhatsApp.`);window.open(generarWhatsApp(state),'_blank');}},
          {icon:'download',color:T.cyan,bg:'rgba(0,229,255,0.06)',border:'rgba(0,229,255,0.22)',label:'PDF',onClick:()=>alert('Descarga de PDF disponible en la versión completa.')}
        ].map(({icon,color,bg,border,label,onClick})=>(
          <button key={label} onClick={onClick} style={{background:bg,border:`1px solid ${border}`,borderRadius:T.radiusSm,padding:'11px 8px',color,cursor:'pointer',fontSize:11,fontWeight:700,display:'flex',flexDirection:'column',alignItems:'center',gap:5,fontFamily:'inherit'}}>
            <Ico name={icon} size={18} color={color}/>{label}
          </button>
        ))}
      </div>
      <GradBtn onClick={handleConfirm} style={{width:'100%'}}><Ico name="check" size={18}/> Confirmar presupuesto</GradBtn>
    </div>
  );
};

// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#FFC300",
  "bgBase": "#05070D",
  "showBanner": true,
  "compactMode": false
}/*EDITMODE-END*/;

function useTweaks(defaults) {
  const [values,setValues]=React.useState(defaults);
  const setTweak=React.useCallback((keyOrEdits,val)=>{
    const edits=typeof keyOrEdits==='object'&&keyOrEdits!==null?keyOrEdits:{[keyOrEdits]:val};
    setValues(prev=>({...prev,...edits}));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits},'*');
  },[]);
  return [values,setTweak];
}

const TweaksPanelNW = ({tweaks,setTweak,onClose,onLoadSample,onReset,onGoto}) => (
  <div className="twk-panel">
    <div className="twk-hd">
      <b>Tweaks</b>
      <button className="twk-x" onClick={onClose}>✕</button>
    </div>
    <div className="twk-body">
      <div className="twk-sect">Colores</div>
      <div className="twk-row twk-row-h"><span className="twk-lbl">Color TOTAL</span><input type="color" className="twk-swatch" value={tweaks.accentColor} onChange={e=>setTweak('accentColor',e.target.value)}/></div>
      <div className="twk-row twk-row-h"><span className="twk-lbl">Fondo base</span><input type="color" className="twk-swatch" value={tweaks.bgBase} onChange={e=>setTweak('bgBase',e.target.value)}/></div>
      <div className="twk-sect">Visual</div>
      <div className="twk-row twk-row-h">
        <span className="twk-lbl">Banner urgente</span>
        <button className="twk-toggle" data-on={tweaks.showBanner?'1':'0'} onClick={()=>setTweak('showBanner',!tweaks.showBanner)}><i/></button>
      </div>
      <div className="twk-sect">Navegación</div>
      {[['servicios','Servicios'],['cotizacion','Cotización'],['datos','Datos'],['firma','Firma'],['listo','Listo']].map(([s,l])=>(
        <button key={s} className="twk-btn-tweak" onClick={()=>onGoto(s)}>{l}</button>
      ))}
      <div className="twk-sect">Estado</div>
      <button className="twk-btn-tweak" onClick={onLoadSample}>Cargar datos de prueba</button>
      <button className="twk-btn-tweak" onClick={onReset}>Limpiar todo</button>
    </div>
  </div>
);

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
const STEP_MAP = {servicios:0,categoria:0,cotizacion:1,datos:1,firma:1,listo:2};

function App() {
  const [tweaks,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [screen,setScreen]=React.useState('servicios');
  const [prevScreen,setPrevScreen]=React.useState('servicios');
  const [selectedCat,setSelectedCat]=React.useState(null);
  const [signed,setSigned]=React.useState(null);
  const [tweakOpen,setTweakOpen]=React.useState(false);
  const saved=loadState();
  const [state,setStateRaw]=React.useState(saved||DEFAULT_STATE);

  const setState=React.useCallback((updater)=>{
    setStateRaw(prev=>{
      const next=typeof updater==='function'?updater(prev):updater;
      saveState(next);
      return next;
    });
  },[]);

  // Tweaks host protocol
  React.useEffect(()=>{
    const handler=(e)=>{
      if(e.data?.type==='__activate_edit_mode') setTweakOpen(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  const goTo=(s,prev=screen)=>{setPrevScreen(prev);setScreen(s);window.scrollTo(0,0);};
  const goBack=()=>{setScreen(prevScreen||'servicios');window.scrollTo(0,0);};
  const handleReset=()=>{setStateRaw(DEFAULT_STATE);saveState(DEFAULT_STATE);setSigned(null);setSelectedCat(null);setScreen('servicios');window.scrollTo(0,0);};
  const handleLoadSample=()=>{
    setState({
      cliente:{nombre:'Carlos Mendoza',empresa:'Club Noise',fecha:new Date().toISOString().split('T')[0],email:'carlos@clubnoise.com'},
      items:[
        {id:'l2',nombre:'Pack visual LED',desc:'Pack de animaciones LED totales.',precio:80000,qty:1,catId:'led'},
        {id:'l4',nombre:'Entrega urgente 24h',desc:'Producción y entrega en 24 horas.',precio:50000,qty:1,catId:'led'},
      ],
      descuento:{label:'',valor:0,codigo:''},
      nota:'Evento el 15/06. Urgente.',
    });
  };

  const subtotal=state.items.reduce((s,i)=>s+i.precio*(i.qty||1),0);
  const discAmt=state.descuento.valor>0?subtotal*(state.descuento.valor/100):0;
  const total=subtotal-discAmt;

  const showFooter=['servicios','categoria','cotizacion'].includes(screen);
  const footerDisabled=state.items.length===0;
  const footerBtn=screen==='cotizacion'?'Continuar':'Ver cotización';
  const handleFooterBtn=()=>{
    if(screen==='cotizacion') goTo('datos','cotizacion');
    else if(state.items.length>0) goTo('cotizacion',screen);
  };

  const renderScreen=()=>{
    switch(screen){
      case 'servicios': return <ServiciosScreen selectedItems={state.items} onCatSelect={cat=>{setSelectedCat(cat);goTo('categoria','servicios');}}/>;
      case 'categoria': return <CategoriaScreen cat={selectedCat} selectedItems={state.items} onAdd={svc=>{if(!state.items.some(i=>i.id===svc.id))setState(p=>({...p,items:[...p.items,{...svc,qty:1}]}));}} onBack={goBack}/>;
      case 'cotizacion': return <CotizacionScreen state={state} setState={setState} onBack={goBack}/>;
      case 'datos': return <DatosScreen state={state} setState={setState} onContinue={()=>goTo('firma','datos')} onBack={goBack}/>;
      case 'firma': return <FirmaScreen state={state} onConfirm={sigData=>{setSigned(sigData);goTo('listo','firma');}} onBack={goBack}/>;
      case 'listo': return <ListoScreen state={state} signed={signed} onReset={handleReset}/>;
      default: return null;
    }
  };

  return (
    <div style={{minHeight:'100vh',background:tweaks.bgBase}}>
      <AppHeader onMenuClick={()=>setTweakOpen(true)}/>
      {screen!=='listo'&&(
        <div style={{background:tweaks.bgBase,borderBottom:`1px solid ${T.border}`}}>
          <StepperProgress step={STEP_MAP[screen]??0}/>
        </div>
      )}
      <main style={{paddingTop:4}}>{renderScreen()}</main>
      {showFooter&&<StickyFooter total={total} btnLabel={footerBtn} onBtn={handleFooterBtn} disabled={footerDisabled}/>}
      {tweakOpen&&(
        <TweaksPanelNW
          tweaks={tweaks}
          setTweak={setTweak}
          onClose={()=>{setTweakOpen(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}}
          onLoadSample={handleLoadSample}
          onReset={handleReset}
          onGoto={(s)=>{setScreen(s);window.scrollTo(0,0);}}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
